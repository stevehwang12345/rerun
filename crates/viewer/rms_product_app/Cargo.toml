[package]
name = "rms_product_app"
authors.workspace = true
description = "RMS product-owned application embedding the Rerun Viewer"
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rms_product_app"
path = "src/bin/rms_product_app.rs"
required-features = ["native"]

[package.metadata.cargo-shear]
ignored = ["wasm-bindgen-futures"] # generated by #[wasm_bindgen] for async functions

[features]
default = []
native = []

[dependencies]
eframe = { workspace = true, default-features = false, features = [
  "default_fonts",
  "persistence",
  "wgpu",
] }
egui.workspace = true
re_chunk.workspace = true
re_async.workspace = true
re_log_channel.workspace = true
re_log_types.workspace = true
re_renderer.workspace = true
re_sdk_types.workspace = true
re_viewer.workspace = true
re_viewer_context.workspace = true
serde = { workspace = true, features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
re_crash_handler.workspace = true
re_log = { workspace = true, features = ["setup"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["HtmlCanvasElement"] }
